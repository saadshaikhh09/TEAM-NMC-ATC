<!doctype html>
<html class="scroll-smooth" lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ATC — Autonomous Travel-Disruption Concierge</title>
    <meta
      name="description"
      content="ATC monitors your airline reservations, detects disruptions before gate announcements, and rebooks flights and hotels within policy — autonomously."
    />
    <!-- Material Symbols is the one remote asset on this page. The three text
         faces ship locally via @fontsource; there is no @fontsource build of
         this icon set, and inlining thirty-one glyphs as SVG buys nothing the
         demo needs. Icons sit beside their own text labels, so a blocked CDN
         degrades to missing glyphs, never to missing meaning. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
